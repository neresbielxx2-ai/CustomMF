name: Build CustomMF.exe

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  smoke-test:
    name: Autoteste (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Autoteste do núcleo
        run: python run.py --selftest --no-ui

      - name: Autoteste da interface (informativo)
        continue-on-error: true
        run: python run.py --selftest

  build:
    name: Compilar CustomMF.exe
    needs: smoke-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Compilar
        run: pyinstaller --noconfirm --clean CustomMF.spec

      - name: Verificar executável
        run: |
          if (!(Test-Path "dist/CustomMF.exe")) { throw "CustomMF.exe não foi gerado!" }
          Get-Item dist/CustomMF.exe | Select-Object Name, Length

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: CustomMF-Windows
          path: dist/CustomMF.exe
          if-no-files-found: error

  release:
    name: Publicar release (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CustomMF-Windows
          path: dist

      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CustomMF.exe
          generate_release_notes: true
