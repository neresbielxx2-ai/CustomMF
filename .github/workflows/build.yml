name: Build CustomMF.exe

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  smoke-test:
    name: Autoteste (Windows)
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Autoteste do núcleo
        run: python run.py --selftest --no-ui

      - name: Autoteste da interface (informativo)
        continue-on-error: true
        run: python run.py --selftest

  build:
    name: Compilar CustomMF.exe
    needs: smoke-test
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Compilar
        run: pyinstaller --noconfirm --clean CustomMF.spec

      - name: Verificar executável
        run: |
          if (!(Test-Path "dist/CustomMF.exe")) { throw "CustomMF.exe não foi gerado!" }
          Get-Item dist/CustomMF.exe | Select-Object Name, Length

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: CustomMF-Windows
          path: dist/CustomMF.exe
          if-no-files-found: error

  release:
    name: Publicar release (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CustomMF-Windows
          path: dist

      - name: Publicar no release (com retry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for i in 1 2 3; do
            if gh release upload "${GITHUB_REF_NAME}" dist/CustomMF.exe --clobber; then
              echo "upload ok"
              break
            fi
            echo "tentativa $i falhou, aguardando…"
            sleep 10
          done
          # garante existência do release e publica o rascunho
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" dist/CustomMF.exe --generate-notes
          gh release edit "${GITHUB_REF_NAME}" --draft=false
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name'
