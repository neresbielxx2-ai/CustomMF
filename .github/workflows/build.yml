name: Build CustomMF.exe

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  smoke-test:
    name: Autoteste (Windows)
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Autoteste do núcleo
        run: python run.py --selftest --no-ui

      - name: Autoteste da interface (informativo)
        continue-on-error: true
        run: python run.py --selftest

  build:
    name: Compilar CustomMF.exe
    needs: smoke-test
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Compilar
        run: pyinstaller --noconfirm --clean CustomMF.spec

      - name: Verificar executável
        run: |
          if (!(Test-Path "dist/CustomMF.exe")) { throw "CustomMF.exe não foi gerado!" }
          Get-Item dist/CustomMF.exe | Select-Object Name, Length

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: CustomMF-Windows
          path: dist/CustomMF.exe
          if-no-files-found: error

  release:
    name: Publicar release (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CustomMF-Windows
          path: dist

      - name: Publicar no release (diagnóstico + retry)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          S="$GITHUB_STEP_SUMMARY"
          REL_ID=$(gh release view "$TAG" --json databaseId --jq .databaseId 2>/dev/null || true)
          if [ -z "$REL_ID" ]; then
            echo "release não existe; criando…" >> "$S"
            gh release create "$TAG" --title "Custom MF $TAG" --generate-notes >> "$S" 2>&1 || true
            REL_ID=$(gh release view "$TAG" --json databaseId --jq .databaseId 2>/dev/null || true)
          fi
          echo "release id: $REL_ID" >> "$S"
          ok=0
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/up.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @dist/CustomMF.exe \
              "https://uploads.github.com/repos/$REPO/releases/$REL_ID/assets?name=CustomMF.exe")
            echo "tentativa $i → HTTP $code · $(head -c 300 /tmp/up.json)" >> "$S"
            [ "$code" = "201" ] && ok=1 && break
            sleep 8
          done
          gh release edit "$TAG" --draft=false >> "$S" 2>&1 || true
          if [ "$ok" != "1" ]; then
            echo "UPLOAD FALHOU apos retries" >> "$S"
            exit 1
          fi
          echo "publicado com sucesso" >> "$S"
          gh release view "$TAG" --json assets --jq '.assets[].name' >> "$S"
