name: Build CustomMF.exe

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  smoke-test:
    name: Autoteste (Windows)
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Autoteste do núcleo
        run: python run.py --selftest --no-ui

      - name: Autoteste da interface (informativo)
        continue-on-error: true
        run: python run.py --selftest

  build:
    name: Compilar CustomMF.exe
    needs: smoke-test
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Compilar
        run: pyinstaller --noconfirm --clean CustomMF.spec

      - name: Verificar executável
        run: |
          if (!(Test-Path "dist/CustomMF.exe")) { throw "CustomMF.exe não foi gerado!" }
          Get-Item dist/CustomMF.exe | Select-Object Name, Length

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: CustomMF-Windows
          path: dist/CustomMF.exe
          if-no-files-found: error

  release:
    name: Publicar release (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CustomMF-Windows
          path: dist

      - name: Publicar no release (diagnóstico + retry)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          main() {
            S="$GITHUB_STEP_SUMMARY"
            echo "== inicio: TAG=$TAG REPO=$REPO ==" | tee -a "$S"
            REL_ID=$(gh release view "$TAG" --json id --jq .id 2>&1 || true)
            echo "view saida: $REL_ID" | tee -a "$S"
            REL_ID=$(echo "$REL_ID" | grep -E '^[0-9]+$' || true)
            if [ -z "$REL_ID" ]; then
              echo "criando release…" | tee -a "$S"
              OUT=$(gh release create "$TAG" --title "Custom MF $TAG" --generate-notes 2>&1) || true
              echo "create saida: $OUT" | tee -a "$S"
              REL_ID=$(gh release view "$TAG" --json id --jq .id 2>/dev/null || true)
            fi
            echo "release id: $REL_ID" | tee -a "$S"
            ok=0
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /tmp/up.json -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @dist/CustomMF.exe \
                "https://uploads.github.com/repos/$REPO/releases/$REL_ID/assets?name=CustomMF.exe")
              echo "upload tentativa $i HTTP $code $(head -c 300 /tmp/up.json)" | tee -a "$S"
              [ "$code" = "201" ] && ok=1 && break
              sleep 8
            done
            gh release edit "$TAG" --draft=false >> "$S" 2>&1 || true
            if [ "$ok" != "1" ]; then
              echo "UPLOAD FALHOU apos retries" | tee -a "$S"
              return 1
            fi
            echo "publicado com sucesso" | tee -a "$S"
          }
          main 2>&1 | tee /tmp/rel_debug.log
          rc=${PIPESTATUS[0]}
          {
            echo "rc=$rc · SUMMARY=$GITHUB_STEP_SUMMARY"
            echo "--- env ---"
            env | grep -E "^(TAG=|REPO=|GITHUB_REF)" || true
            echo "--- log ---"
            head -c 60000 /tmp/rel_debug.log
          } > /tmp/rel_comment.txt
          gh api repos/$REPO/commits/$GITHUB_SHA/comments -f body="$(cat /tmp/rel_comment.txt)" >/dev/null 2>&1 || true
          exit $rc
